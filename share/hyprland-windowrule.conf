# OmoCrisisMonitor — Hyprland rules. Append to ~/.config/hypr/ (e.g. an
# `source = ` line, or paste into windows.conf).
#
# Chromium on Wayland does not honour --class for --app windows, so match on
# the window title (kept stable as "OmoCrisisMonitor" by <title>).

windowrule = monitor DP-2, title:^(OmoCrisisMonitor)$
windowrule = workspace name:crisis, title:^(OmoCrisisMonitor)$
windowrule = float, title:^(OmoCrisisMonitor)$
windowrule = size 1760 990, title:^(OmoCrisisMonitor)$
windowrule = center, title:^(OmoCrisisMonitor)$
