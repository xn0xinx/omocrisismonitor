[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omocrisismonitor"
version = "0.7.0"
description = "OmoCrisisMonitor — a themed situational-awareness console: live AIS shipping, GeoConfirmed conflict events, and global fuel prices on one interactive map, with an AI synthesis sidebar."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "xn0xinx" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "anyio>=4",
]

[project.scripts]
omocrisismonitor = "omocrisismonitor.__main__:main"

[project.urls]
Homepage = "https://github.com/xn0xinx/omocrisismonitor"

[tool.hatch.build.targets.wheel]
packages = ["omocrisismonitor"]

[tool.hatch.build.targets.wheel.force-include]
"omocrisismonitor/web" = "omocrisismonitor/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
