<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmoCrisisMonitor</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="map"></div>
  <div id="ais-badge" class="badge" hidden></div>
  <div id="conflict-badge" class="badge badge-2" hidden></div>
  <aside id="detail" hidden></aside>
  <aside id="fuel-panel" class="mono" hidden></aside>
  <aside id="alerts-panel" class="mono" hidden></aside>
  <div id="scrubber" class="mono" hidden></div>

  <div id="ai-drawer" hidden>
    <header>
      <span class="term-dot"></span>
      <span class="nm">AI SYNTHESIS</span>
      <span id="ai-cursor" class="dim" hidden>&#9612; thinking&hellip;</span>
      <select id="ai-backend" class="mono" title="AI backend"></select>
      <span id="ai-meta" class="dim mono"></span>
      <span class="grow"></span>
      <button id="ai-refresh" title="Refresh now">&#8635;</button>
      <button id="ai-close" title="Close">&times;</button>
    </header>
    <pre id="ai-body" class="mono"></pre>
  </div>

  <header id="topbar">
    <span class="brand">OMO<b>CRISIS</b>MONITOR</span>
    <span id="conn" class="pill" data-state="wait"><i></i><span>link</span></span>
    <span class="sep"></span>
    <span id="viewinfo" class="mono dim"></span>
    <span class="grow"></span>
    <span id="clock" class="mono">--:--:--</span>
    <button id="full" title="Fullscreen (F)">&#9187;</button>
  </header>

  <nav id="rail">
    <button class="layer" data-layer="ais"      title="Phase 1">AIS</button>
    <button class="layer" data-layer="conflict" title="Phase 2">CONFLICT</button>
    <button class="layer" data-layer="fuel"     title="Phase 3">FUEL</button>
    <button class="layer" data-layer="ai"       title="Phase 4">AI</button>
    <button class="layer" data-layer="alerts"   title="Phase 5">ALERTS</button>
  </nav>

  <footer id="statusline" class="mono">
    <span id="phase">phase 5 &middot; alerts</span>
    <span class="grow"></span>
    <span id="msg">booting&hellip;</span>
  </footer>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="app.js"></script>
  <script src="ais.js"></script>
  <script src="conflict.js"></script>
  <script src="fuel.js"></script>
  <script src="ai.js"></script>
  <script src="alerts.js"></script>
</body>
</html>
